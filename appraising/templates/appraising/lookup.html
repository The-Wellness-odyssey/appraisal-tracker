{% extends 'appraising/layout.html' %}

{% block content %}
    <h1>Live Lookup</h1>
    <p>Results come from <a href="{% url 'api_appraisals' %}">{% url 'api_appraisals' %}</a> as JSON and are drawn on this page without a reload.</p>

    <!-- Without JavaScript this form falls back to the server-rendered Search page -->
    <form id="lookup-form" action="{% url 'search' %}" method="GET" data-api="{% url 'api_appraisals' %}" class="lookup-form">
        <input type="search" name="q" id="lookup-q" placeholder="Claim number or vehicle, e.g. camry" aria-label="Search text">
        <select name="status" id="lookup-status" aria-label="Status">
            <option value="">Any status</option>
            {% for value, label in status_choices %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>
        <button type="submit">Search</button>
    </form>

    <p id="lookup-message" class="lookup-message" aria-live="polite"></p>
    <ul id="lookup-results" class="lookup-results"></ul>
{% endblock %}
